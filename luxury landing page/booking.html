<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
    <style>
        /* Add your styles here */
        .form-container {
            width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-container input,
        .form-container textarea,
        .form-container button {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            font-size: 16px;
        }

    </style>
</head>
<body>
    <div class="form-container">
        <h2>Booking Form</h2>
        <form id="booking-form">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required />

            <label for="phone-number">Phone Number</label>
            <input type="tel" id="phone-number" name="phone-number" placeholder="Enter your phone number" required />

            <label for="preferred-date">Preferred Date</label>
            <input type="date" id="preferred-date" name="preferred-date" required />

            <label for="preferred-time">Preferred Time</label>
            <input type="time" id="preferred-time" name="preferred-time" required />

            <label for="full-name">Watch of Choice</label>
            <input type="text" id="full-name" name="full-name" placeholder="Enter your watch" required />

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Additional details..." rows="4"></textarea>

            <button type="submit">Book Now</button>
        </form>
    </div>

    <script>
        // Pre-fill the "Watch of Choice" field with the query parameter value
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const watchName = params.get('watch'); // Get watch name from URL
            if (watchName) {
                document.getElementById('watch-choice').value = watchName; // Pre-fill field
            }
        });

        // Handle form submission
        const bookingForm = document.getElementById('booking-form');
        bookingForm.addEventListener('submit', (event) => {
            event.preventDefault();
            alert('Booking submitted successfully!');
            // You can add more logic to process the form data (e.g., send to server)
        });
    </script>
</body>
</html>
